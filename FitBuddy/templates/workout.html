{% extends 'base.html' %}

{% block title %}Activity Planner – FitBuddy{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-2 space-y-6">
  <div class="border-b border-slate-200 pb-3">
    <h2 class="text-2xl font-bold text-slate-900">Activity Planner</h2>
    <p class="text-xs sm:text-sm text-slate-500 mt-1">Non-extreme, gentle movement sessions customized for college students via Gemini.</p>
  </div>

  <!-- Form -->
  <form id="workout-form" class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Wellness Goal</label>
        <select id="workout-goal" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
          <option value="General fitness">General fitness</option>
          <option value="Daily movement">Daily movement</option>
          <option value="Mobility and flexibility">Mobility and flexibility</option>
          <option value="Relaxation/light activity">Relaxation/light activity</option>
          <option value="Desk posture correction">Desk posture correction</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Available Time</label>
        <select id="workout-time" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
          <option value="10">10 Minutes</option>
          <option value="15">15 Minutes</option>
          <option value="20" selected>20 Minutes</option>
          <option value="30">30 Minutes</option>
          <option value="45">45 Minutes</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Experience Level</label>
        <select id="workout-level" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
          <option value="Beginner" selected>Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Casual / Light">Casual / Light</option>
        </select>
      </div>
    </div>

    <div class="flex items-center justify-between pt-2">
      <span class="text-xs text-slate-500">No gym equipment or extreme strain required.</span>
      <button type="submit" id="generate-workout-btn" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-xs transition-all">
        Generate Routine
      </button>
    </div>
  </form>

  <!-- Routine Output Container -->
  <div id="workout-result" class="hidden bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-xs space-y-6">
    <!-- Populated by script.js -->
  </div>
</div>
{% endblock %}
