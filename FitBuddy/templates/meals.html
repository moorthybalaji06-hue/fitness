{% extends 'base.html' %}

{% block title %}Meal Ideas – FitBuddy{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-2 space-y-6">
  <div class="border-b border-slate-200 pb-3">
    <h2 class="text-2xl font-bold text-slate-900">Balanced Meal Ideas</h2>
    <p class="text-xs sm:text-sm text-slate-500 mt-1">Wholesome, student-budget friendly ideas without restrictive diets or calorie targets.</p>
  </div>

  <!-- Form -->
  <form id="meals-form" class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Food Preference</label>
        <select id="meal-preference" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
          <option value="No preference">No preference</option>
          <option value="Vegetarian" selected>Vegetarian</option>
          <option value="Non-vegetarian">Non-vegetarian</option>
          <option value="Vegan">Vegan</option>
          <option value="South Indian">South Indian</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Kitchen / Hostal Context</label>
        <input type="text" id="meal-notes" placeholder="e.g. Hostel kettle, college canteen, quick 10 min cooking" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
      </div>
    </div>

    <div class="flex items-center justify-between pt-2">
      <span class="text-xs text-slate-500">Non-restrictive nourishment to fuel study energy.</span>
      <button type="submit" id="generate-meals-btn" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-xs transition-all">
        Generate Meals
      </button>
    </div>
  </form>

  <!-- Output Container -->
  <div id="meals-result" class="hidden space-y-4">
    <!-- Populated by script.js -->
  </div>
</div>
{% endblock %}
