{% extends 'base.html' %}

{% block title %}Login – FitBuddy{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
  <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-xs space-y-6">
    <div class="text-center space-y-1">
      <h2 class="text-2xl font-bold text-slate-900">Student Login</h2>
      <p class="text-xs text-slate-500">Sign in using Firebase Authentication</p>
    </div>

    <div id="auth-error-msg" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-700"></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
        <input type="email" id="login-email" required placeholder="student@campus.edu" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600">
      </div>
      <button type="submit" id="login-btn" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-xs transition-all">
        Login to FitBuddy
      </button>
    </form>

    <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
      Don't have an account? <a href="/register" class="text-blue-600 font-bold hover:underline">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
